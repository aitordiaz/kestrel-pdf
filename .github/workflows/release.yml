name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-phase1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: kestrel-pdf-windows-x64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/kestrel-app.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: kestrel-pdf-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/kestrel-app
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: kestrel-pdf-linux-x64
            binary_path: target/x86_64-unknown-linux-gnu/release/kestrel-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p kestrel-app

      - name: Rename and Prepare Binary
        shell: bash
        run: |
          mkdir -p dist
          cp ${{ matrix.binary_path }} dist/${{ matrix.artifact_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-release-artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all built artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          EXTRA_FLAGS=""
          if [[ "$TAG" == *"-rc"* ]]; then
            EXTRA_FLAGS="--prerelease"
          fi
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --generate-notes $EXTRA_FLAGS || gh release upload "$TAG" release-assets/* --clobber
