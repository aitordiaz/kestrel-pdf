[workspace]
members = [
    "crates/kestrel-core",
    "crates/kestrel-app",
]
resolver = "2"

[workspace.package]
version = "0.2.5"
edition = "2021"
authors = ["Aitor Diaz"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/aitordiaz/kestrel-pdf"
description = "Ultra-high-performance universal PDF reader and editor"

[workspace.dependencies]
# Rendering & PDF manipulation
pdfium-render = "0.8"
lopdf = "0.33"

# GUI & Graphics (Universal: Win/Mac/Linux/FreeBSD/WASM)
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
egui = "0.29"

# Concurrency & async
crossbeam-channel = "0.5"
rayon = "1.10"
parking_lot = "0.12"
lru = "0.12"

# Utilities & Error handling
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
flate2 = "1.0"

# WebAssembly
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
